name: MATLAB License Check

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-check:
    runs-on: ubuntu-latest

    env:
      # Batch Licensing Token for MathWorks Online License.
      # Add MATHWORKS_TOKEN under Settings -> Secrets and variables -> Actions.
      # See https://github.com/matlab-actions/setup-matlab for setup details.
      MLM_LICENSE_TOKEN: ${{ secrets.MATHWORKS_TOKEN }}

    steps:
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          cache: true

      - name: Verify MATLAB license
        uses: matlab-actions/run-command@v2
        with:
          command: disp(version)
