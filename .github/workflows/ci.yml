name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        clickhouse_version: ['25.3', '25.8', 'latest']

    env:
      # Batch Licensing Token for MathWorks Online License.
      # Add MATHWORKS_TOKEN under Settings -> Secrets and variables -> Actions.
      # See https://github.com/matlab-actions/setup-matlab for setup details.
      MLM_LICENSE_TOKEN: ${{ secrets.MATHWORKS_TOKEN }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          cache: true

      - name: Run tests (ClickHouse ${{ matrix.clickhouse_version }})
        run: ./test/run_tests.sh ${{ matrix.clickhouse_version }}
