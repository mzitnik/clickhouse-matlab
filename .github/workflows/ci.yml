name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        clickhouse_version: ['25.3', '25.8', 'latest']
        matlab_release: ['R2023b', 'R2024a', 'R2024b', 'R2025a']

    env:
      # Batch Licensing Token for MathWorks Online License.
      # Add MATHWORKS_TOKEN under Settings -> Secrets and variables -> Actions.
      # See https://github.com/matlab-actions/setup-matlab for setup details.
      MLM_LICENSE_TOKEN: ${{ secrets.MATHWORKS_TOKEN }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.matlab_release }}
          cache: true

      - name: Start ClickHouse ${{ matrix.clickhouse_version }}
        run: ./test/start_clickhouse.sh ${{ matrix.clickhouse_version }}

      - name: Build MEX
        uses: matlab-actions/run-command@v2
        with:
          command: build

      - name: Run tests
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: src
          select-by-folder: test
          test-results-junit: test-results/results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-clickhouse-${{ matrix.clickhouse_version }}-matlab-${{ matrix.matlab_release }}
          path: test-results/results.xml

      - name: Stop ClickHouse
        if: always()
        run: ./test/stop_clickhouse.sh
